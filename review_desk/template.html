<title>EviBound 语料审核台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: review desk on blueprint paper (EviBound demo system) - queue rail | item sheet | verdict panel;
   two columns under 1180px (queue becomes a drawer), one column with a bottom action dock under 820px. */
:root {
  --paper: #f2f6fc; --paper-2: #ffffff; --paper-3: #e6eef9; --paper-4: #d5e1f2;
  --ink: #0b2347; --ink-2: #3d5a85; --ink-3: #657d9f;
  --line: #c3d3ea; --line-2: #dde7f4;
  --cyan: #0a7aa3; --amber: #935d00; --mint: #0b7d5b; --violet: #5a41c0; --ember: #b93d0b; --rose: #bb1755;
  --ok-soft: rgba(11, 125, 91, .11); --warn-soft: rgba(147, 93, 0, .12); --bad-soft: rgba(187, 23, 85, .10);
  --cyan-soft: rgba(10, 122, 163, .10); --violet-soft: rgba(90, 65, 192, .10); --ember-soft: rgba(185, 61, 11, .10);
  --lamp: #e39b00; --lamp-soft: rgba(227, 155, 0, .30); --fan: #0a7aa3; --glyph-off: #9aaecb;
  --shadow: 0 8px 28px rgba(11, 35, 71, .09);
  --f-display: "Big Shoulders Display", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  --top-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #071a35; --paper-2: #0b2347; --paper-3: #10305e; --paper-4: #16407a;
    --ink: #e8f1ff; --ink-2: #a9c0e4; --ink-3: #7d97be;
    --line: #2f5f9e; --line-2: #1d4075;
    --cyan: #5ee1ff; --amber: #ffc857; --mint: #46f2b6; --violet: #b89bff; --ember: #ff7a52; --rose: #ff4f80;
    --ok-soft: rgba(70, 242, 182, .14); --warn-soft: rgba(255, 200, 87, .15); --bad-soft: rgba(255, 79, 128, .16);
    --cyan-soft: rgba(94, 225, 255, .12); --violet-soft: rgba(184, 155, 255, .14); --ember-soft: rgba(255, 122, 82, .14);
    --lamp: #ffc857; --lamp-soft: rgba(255, 200, 87, .30); --fan: #5ee1ff; --glyph-off: #4b6a96;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #071a35; --paper-2: #0b2347; --paper-3: #10305e; --paper-4: #16407a;
  --ink: #e8f1ff; --ink-2: #a9c0e4; --ink-3: #7d97be;
  --line: #2f5f9e; --line-2: #1d4075;
  --cyan: #5ee1ff; --amber: #ffc857; --mint: #46f2b6; --violet: #b89bff; --ember: #ff7a52; --rose: #ff4f80;
  --ok-soft: rgba(70, 242, 182, .14); --warn-soft: rgba(255, 200, 87, .15); --bad-soft: rgba(255, 79, 128, .16);
  --cyan-soft: rgba(94, 225, 255, .12); --violet-soft: rgba(184, 155, 255, .14); --ember-soft: rgba(255, 122, 82, .14);
  --lamp: #ffc857; --lamp-soft: rgba(255, 200, 87, .30); --fan: #5ee1ff; --glyph-off: #4b6a96;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 14.5px/1.6 var(--f-body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--paper); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.mono, kbd, code { font-family: var(--f-mono); }
kbd { font-size: 11px; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--ink-2); background: var(--paper-2); line-height: 1.5; }
.en { color: var(--ink-3); font-size: 12.5px; }
.en-2 { display: none; }
.show-en .en-2 { display: block; }
.show-en .en-2.inl { display: inline; }
.app { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); border-bottom: 1px solid var(--line-2);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand h1 { font: 800 25px/1 var(--f-display); letter-spacing: .06em; }
.brand h1 span { font-weight: 600; letter-spacing: .02em; color: var(--cyan); }
.brand .sub { color: var(--ink-2); font-size: 12.5px; margin-top: 3px; }
.progress { flex: 1 1 300px; min-width: 0; display: grid; gap: 5px; }
.meter { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line-2); }
.meter i { display: block; height: 100%; transition: width .25s; }
.meter .m-ok { background: var(--mint); } .meter .m-fix { background: var(--amber); } .meter .m-bad { background: var(--rose); }
.counts { font-size: 12.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--paper-2); border-radius: 8px; padding: 5px 11px; color: var(--ink); }
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: var(--cyan); border-color: var(--cyan); color: var(--paper); font-weight: 600; }
.btn[aria-pressed="true"] { background: var(--cyan-soft); border-color: var(--cyan); color: var(--cyan); }
select.btn { padding-right: 26px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper-2); }
.seg button { border: 0; background: transparent; padding: 5px 10px; color: var(--ink-2); border-right: 1px solid var(--line-2); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--cyan-soft); color: var(--cyan); font-weight: 600; }
.only-narrow { display: none; }
.banner { margin-top: 12px; border: 1px solid var(--amber); background: var(--warn-soft); color: var(--ink); border-radius: var(--r); padding: 9px 14px; font-size: 13.5px; }
.banner b { color: var(--amber); }

/* ---------- desk ---------- */
.desk { display: grid; grid-template-columns: 250px minmax(0, 1fr) 340px; gap: 18px; align-items: start; padding-top: 16px; }
.rail, .panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 14px); max-height: calc(100dvh - var(--top-h) - 30px); overflow: auto; }
.rail { border: 1px solid var(--line-2); border-radius: var(--r); background: var(--paper-2); padding: 8px; }
.rail h4 { margin: 10px 6px 4px; font: 600 11px/1.4 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; }
.rail h4:first-child { margin-top: 2px; }
.row { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; border-left: 3px solid transparent; background: transparent; border-radius: 6px; padding: 5px 8px; color: var(--ink); font-size: 13px; }
.row:hover { background: var(--paper-3); }
.row.cur { background: var(--cyan-soft); border-left-color: var(--cyan); }
.row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { font: 11px var(--f-mono); color: var(--ink-3); }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
.dot.approve { background: var(--mint); border-color: var(--mint); }
.dot.fix { background: var(--amber); border-color: var(--amber); }
.dot.reject { background: var(--rose); border-color: var(--rose); }
.dot.stale { border-color: var(--amber); border-style: dashed; }
.dot.opt { border-style: dotted; }
.empty-q { color: var(--ink-3); padding: 12px 8px; font-size: 13px; }

/* ---------- sheet ---------- */
.sheet { display: grid; gap: 14px; min-width: 0; }
.head { display: grid; gap: 6px; padding: 2px 2px 4px; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 500 12px/1.4 var(--f-mono); color: var(--ink-3); letter-spacing: .04em; }
.kind-tag { color: var(--cyan); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.pill { font: 600 11px/1.6 var(--f-body); border-radius: 99px; padding: 0 8px; border: 1px solid var(--line); color: var(--ink-2); }
.pill.req { border-color: var(--violet); color: var(--violet); background: var(--violet-soft); }
.pill.stale { border-color: var(--amber); color: var(--amber); background: var(--warn-soft); }
.head h2 { font: 800 30px/1.08 var(--f-display); letter-spacing: .02em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; background: var(--paper-2); color: var(--ink-2); }
.chip small { color: var(--ink-3); margin-left: 4px; }
.chip.k-attack { border-color: var(--ember); color: var(--ember); }
.chip.k-task_type { border-color: var(--violet); color: var(--violet); }
.chip.k-distractor { border-color: var(--amber); color: var(--amber); }
.block { background: var(--paper-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.block-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.block-h h3 { font: 600 13px/1.4 var(--f-body); letter-spacing: .06em; color: var(--ink-2); }
.source { font-size: 17px; line-height: 1.55; color: var(--ink); }
.source.big { font-size: 20px; }
.zh-box { border-left: 3px solid var(--violet); background: var(--violet-soft); border-radius: 0 8px 8px 0; padding: 8px 12px; display: grid; gap: 2px; }
.zh-tag { font-size: 11.5px; color: var(--violet); font-weight: 600; letter-spacing: .04em; }
.zh-box p { font-size: 16px; }
.note { color: var(--ink-2); font-size: 13px; }
.phr { display: flex; flex-wrap: wrap; gap: 6px; }
.phr span { font-size: 12.5px; border: 1px dashed var(--line); border-radius: 6px; padding: 1px 8px; color: var(--ink-2); }
.phr span b { color: var(--ink); font-weight: 600; }
.reading { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; border-top: 1px solid var(--line-2); padding-top: 10px; font-size: 13.5px; }
.reading .lbl { color: var(--ink-3); font-size: 12.5px; }
.reading .val { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.st { border-radius: 6px; padding: 0 8px; background: var(--paper-3); font-size: 13px; }
.ok-badge { color: var(--mint); font-weight: 600; font-size: 12.5px; }
.bad-badge { color: var(--rose); font-weight: 600; font-size: 12.5px; }
.dgm { overflow-x: auto; }
.dgm svg { display: block; width: 100%; min-width: 560px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid; vertical-align: middle; margin-right: 6px; }
.legend .l-true { border-color: var(--mint); } .legend .l-att { border-color: var(--rose); border-top-style: dashed; }
.rd { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line-2); }
.rd:first-of-type { border-top: 0; padding-top: 0; }
.rd .who { font-size: 12.5px; color: var(--ink-3); padding-top: 2px; }
.rd .src { font-size: 14.5px; }
.rd .zh { font-size: 14px; color: var(--violet); }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 14px; }
.dl dt { color: var(--ink-3); font-size: 13px; white-space: nowrap; }
.dl dd { margin: 0; }
.dl dd.att { color: var(--ember); }
.checks summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--ink-2); }
.checks ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.checks li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; }
.checks li .i-ok { color: var(--mint); font-weight: 700; } .checks li .i-bad { color: var(--rose); font-weight: 700; }
.all-ok { color: var(--mint); }
.has-bad { color: var(--rose); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th, .tbl td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.tbl th { color: var(--ink-3); font-weight: 600; font-size: 12.5px; }
.tblwrap { overflow-x: auto; }
.uses { display: flex; flex-wrap: wrap; gap: 6px; }
.uses button { font: 12px var(--f-mono); border: 1px solid var(--line); border-radius: 6px; background: var(--paper-2); color: var(--cyan); padding: 1px 7px; }

/* svg */
.sv-box { fill: var(--paper-2); stroke: var(--line); stroke-width: 1.2; }
.sv-box.true { stroke: var(--mint); stroke-width: 2.4; }
.sv-box.att { stroke: var(--rose); stroke-width: 2; stroke-dasharray: 7 5; }
.sv-h { fill: var(--ink); font: 600 14px var(--f-body); }
.sv-s { fill: var(--ink-3); font: 11.5px var(--f-body); }
.sv-lbl { fill: var(--ink-2); font: 12.5px var(--f-body); }
.sv-tag-true { fill: var(--mint); font: 700 12px var(--f-body); }
.sv-tag-att { fill: var(--rose); font: 700 12px var(--f-body); }
.sv-edge-true { fill: none; stroke: var(--mint); stroke-width: 2.6; }
.sv-edge-att { fill: none; stroke: var(--rose); stroke-width: 2; stroke-dasharray: 7 5; }
.sv-edge-txt-true { fill: var(--mint); font: 600 12.5px var(--f-body); }
.sv-edge-txt-att { fill: var(--rose); font: 600 12.5px var(--f-body); }
.sv-pill { fill: var(--paper); stroke: var(--line-2); }
.sv-bulb-off { fill: none; stroke: var(--glyph-off); stroke-width: 2; }
.sv-bulb-low { fill: var(--lamp-soft); stroke: var(--lamp); stroke-width: 2; }
.sv-bulb-high { fill: var(--lamp); stroke: var(--lamp); stroke-width: 2; }
.sv-ray { stroke: var(--lamp); stroke-width: 2; stroke-linecap: round; }
.sv-base { fill: var(--glyph-off); }
.sv-fan-off { fill: var(--glyph-off); }
.sv-fan-on { fill: var(--fan); }
.sv-arc { fill: none; stroke: var(--fan); stroke-width: 2; stroke-linecap: round; }
.sv-person { fill: var(--violet); }
.sv-person-no { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 3 3; }
.sv-lock { fill: var(--paper-2); stroke: var(--rose); stroke-width: 1.8; }
.sv-ring { fill: none; stroke: var(--cyan); stroke-width: 1.5; stroke-dasharray: 3 3; }
.sv-dim { opacity: .42; }
.sv-cell-ok { fill: var(--ok-soft); stroke: var(--line-2); }
.sv-cell-bad { fill: var(--bad-soft); stroke: var(--rose); }
.sv-mark-ok { fill: var(--mint); font: 700 15px var(--f-body); }
.sv-mark-bad { fill: var(--rose); font: 700 15px var(--f-body); }
.sv-node { fill: var(--paper-2); stroke: var(--cyan); stroke-width: 2; }
.sv-ok-line { fill: none; stroke: var(--mint); stroke-width: 2; }
.sv-bad-line { fill: none; stroke: var(--rose); stroke-width: 2.2; stroke-dasharray: 6 4; }
.sv-arrow-ok { fill: var(--mint); } .sv-arrow-bad { fill: var(--rose); }
.sv-tl { stroke: var(--line); stroke-width: 2; }
.sv-rec { fill: var(--cyan-soft); stroke: var(--cyan); }
.sv-rec-bad { fill: var(--bad-soft); stroke: var(--rose); }

/* ---------- verdict panel ---------- */
.panel { border: 1px solid var(--line); border-radius: var(--r); background: var(--paper-2); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 12px; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; }
.panel-h h3 { font: 800 20px/1 var(--f-display); letter-spacing: .06em; }
.panel-h .pos { font: 12px var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding-bottom: 10px; border-bottom: 1px solid var(--line-2); }
.q .qt { font-weight: 600; font-size: 14px; }
.q .qt kbd { margin-right: 6px; }
.q .hint { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); }
.yn button { min-width: 42px; }
.yn button[data-v="Y"][aria-pressed="true"] { background: var(--ok-soft); color: var(--mint); }
.yn button[data-v="N"][aria-pressed="true"] { background: var(--bad-soft); color: var(--rose); }
.line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.decide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.decide button { border: 1.5px solid var(--line); background: var(--paper-2); border-radius: 9px; padding: 9px 4px; font-weight: 600; display: grid; justify-items: center; gap: 2px; }
.decide button kbd { font-weight: 400; }
.decide [data-d="approve"] { border-color: var(--mint); color: var(--mint); }
.decide [data-d="fix"] { border-color: var(--amber); color: var(--amber); }
.decide [data-d="reject"] { border-color: var(--rose); color: var(--rose); }
.decide [data-d="approve"][aria-pressed="true"] { background: var(--mint); color: var(--paper); }
.decide [data-d="fix"][aria-pressed="true"] { background: var(--amber); color: var(--paper); }
.decide [data-d="reject"][aria-pressed="true"] { background: var(--rose); color: var(--paper); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags button { border: 1px solid var(--line); border-radius: 99px; background: var(--paper-2); padding: 2px 10px; font-size: 12.5px; color: var(--ink-2); }
.tags button[aria-pressed="true"] { border-color: var(--amber); background: var(--warn-soft); color: var(--amber); }
.note-lbl { font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; }
textarea#note { width: 100%; min-height: 70px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 8px 10px; font-size: 14px; line-height: 1.5; }
textarea#note.need { border-color: var(--rose); background: var(--bad-soft); }
.need-note { color: var(--rose); font-size: 12.5px; }
.nav { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; }
.sync { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; flex: none; }
.sync.s-db i { background: var(--mint); } .sync.s-warn i { background: var(--amber); } .sync.s-bad i { background: var(--rose); }
.sys-warn { border: 1px solid var(--amber); background: var(--warn-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.flash { border: 1px solid var(--rose); background: var(--bad-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.keys { font-size: 12px; color: var(--ink-3); line-height: 1.9; }

/* ---------- dock (phones) ---------- */
.dock { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 35; background: var(--paper-2); border-top: 1px solid var(--line);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); gap: 8px; }
.dock button { flex: 1; border: 1.5px solid var(--line); border-radius: 9px; background: var(--paper-2); padding: 9px 4px; font-weight: 600; }
.dock .nv { flex: 0 0 48px; }
.dock [data-d="approve"] { border-color: var(--mint); color: var(--mint); }
.dock [data-d="fix"] { border-color: var(--amber); color: var(--amber); }
.dock [data-d="reject"] { border-color: var(--rose); color: var(--rose); }
.dock [aria-pressed="true"][data-d="approve"] { background: var(--mint); color: var(--paper); }
.dock [aria-pressed="true"][data-d="fix"] { background: var(--amber); color: var(--paper); }
.dock [aria-pressed="true"][data-d="reject"] { background: var(--rose); color: var(--paper); }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(4, 14, 32, .55); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

<script>
(function () {
  'use strict';

  var RUN = META.run_key;
  var KEY = 'evibound-review:' + RUN;
  var KIND = { rule: ['规则', 'rule'], convention: ['约定', 'convention'], caption: ['描述', 'caption'], task: ['任务', 'task'] };
  var GROUP = { rules: '规则与约定', captions: '摄像头描述', holdout: '任务 · holdout', dev: '任务 · dev' };
  var TAGS = [['unclear', '原话含糊'], ['goal', '目标不合理'], ['attack', '攻击说明不对'], ['expect', '预期行为不对'],
    ['zh', '翻译有误'], ['label', '标签有误'], ['diagram', '示意图有误'], ['other', '其他']];
  var ZD = { light: '灯', fan: '风扇' };
  var ZL = { off: '关', low: '1 档', high: '2 档' };
  var CONF = [['high', '高', 'H'], ['med', '中', 'M'], ['low', '低', 'L']];

  function rd(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }

  var S = {
    verdicts: rd(KEY, {}) || {},
    queue: rd(KEY + ':queue', 'required'),
    kind: rd(KEY + ':kind', 'all'),
    showEn: !!rd('evibound-review:showEn', false),
    current: null, backend: 'connecting', sync: '', reviewer: null, stamps: [], flash: '', readonly: false
  };

  /* ---------------- verdict model ---------------- */
  function vOf(it) { var v = S.verdicts[it.id]; return v && v.item_hash === it.hash ? v : null; }
  function stale(it) { var v = S.verdicts[it.id]; return !!(v && v.decision && v.item_hash !== it.hash); }
  function done(it) { var v = vOf(it); return !!(v && v.decision); }

  function flagged(it) { var v = vOf(it); return !!v && (v.decision === 'fix' || v.decision === 'reject' || anyNo(it, v)); }
  function inKind(it) { return S.kind === 'all' || it.kind === S.kind || (S.kind === 'rule' && it.kind === 'convention'); }
  function queue() {
    return ITEMS.filter(function (it) {
      if (!inKind(it)) return false;
      switch (S.queue) {
        case 'all': return true;
        case 'todo': return it.required && !done(it);
        case 'flagged': return flagged(it);
        case 'stale': return stale(it);
        default: return it.required;
      }
    });
  }
  function cur() { return BY_ID[S.current] || ITEMS[0]; }
  function counts() {
    var c = { req: 0, done: 0, approve: 0, fix: 0, reject: 0, notes: 0, stale: 0, optDone: 0 };
    ITEMS.forEach(function (it) {
      var v = vOf(it);
      if (stale(it)) c.stale++;
      if (!it.required) { if (v && v.decision) c.optDone++; return; }
      c.req++;
      if (v && v.decision) { c.done++; c[v.decision]++; if (needNote(it, v)) c.notes++; }
    });
    return c;
  }

  /* ---------------- persistence ---------------- */
  // Each annotator writes only their own subtree: reviewers/<id>/runs/<run>/verdicts/<item>
  // (published rules: reviewers -> read admin, write self; reviewers/{self} -> interact).
  var COL = null, PROFILE = null, chains = {}, timers = {}, profileChain = Promise.resolve();
  var PROF = { run_key: RUN };

    if (extra) Object.assign(PROF, extra);
    PROF.updated_at = new Date().toISOString();
    if (!PROFILE || S.readonly) return;
    var body = JSON.parse(JSON.stringify(PROF));
    profileChain = profileChain.then(function () { return PROFILE.set(body); }).catch(function () {});
  }
  function setBackend(b) { S.backend = b; paintSync(); }
  function persist(id, v, debounce) {
    if (!COL || S.readonly) return;
    clearTimeout(timers[id]);
    var run = function () {
      S.sync = 'saving'; paintSync();

  }
  function pushLocal(remote) {
    var pushed = 0;
    Object.keys(S.verdicts).forEach(function (id) {
      var lv = S.verdicts[id], rv = remote[id];
      if (lv.by && lv.by !== S.reviewer) return; // someone else's cached work in this browser

  }
  function connect() {

    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {

  function attach(db, uid) {
      if (!uid) { setBackend('noid'); return; }
      S.reviewer = uid;

      var slow = setTimeout(function () { if (S.backend === 'connecting') setBackend('slow'); }, 10000);

  /* ---------------- actions ---------------- */
  function patch(it, ch, debounce) {
    if (S.readonly) { toast('你没有写入权限，结果不会保存'); }

    var v = Object.assign({}, old, ch, { kind: it.kind, item_hash: it.hash, updated_at: new Date().toISOString() });
    if (S.reviewer) v.by = S.reviewer;

    S.verdicts[it.id] = v;

  }
  function stamp() { S.stamps.push(Date.now()); if (S.stamps.length > 400) S.stamps.shift(); }
  function approve(it) {

  }
  function decide(it, d) {
    if (d === 'approve') return approve(it);
    var v = vOf(it) || {};
    var ch = { decision: d, conf: v.conf || 'med' };

  function toggleQ(it, key, val) {

  /* ---------------- navigation ---------------- */
  function go(id, keepScroll) {

  }
  function nextTodo(auto) {

    var todo = ITEMS.filter(function (it) { return inKind(it) && it.required && !done(it); });

    var n = todo.filter(function (it) { return it.index > c.index; })[0] || todo[0];

  /* ---------------- rendering: header ---------------- */
  function paintProgress() {

    var e = eta(c.req - c.done);
    $('counts').innerHTML = '<span>必审 <b>' + c.done + '</b>/' + c.req + '</span><span>通过 ' + c.approve + '</span><span>需修改 ' + c.fix + '</span><span>拒绝 ' + c.reject + '</span>'
      + (c.notes ? '<span class="has-bad">缺备注 ' + c.notes + '</span>' : '')
      + (c.stale ? '<span class="has-bad">内容已更新 ' + c.stale + '</span>' : '')

    var head = $('sheet').querySelector('.head');
    if (!head) return paintSheet();
    var tmp = document.createElement('div'); tmp.innerHTML = headHtml(cur());
    head.replaceWith(tmp.firstChild);
  }
  function paintTop() {
    $('sub').textContent = META.corpus + ' 语料 · ' + (META.mode === 'practice' ? '练习（已冻结，不签署）' : '正式审核') + ' · ' + META.required + ' 条必审：规则 ' + ((META.counts.rule || 0) + (META.counts.convention || 0)) + ' · 描述 ' + (META.counts.caption || 0) + ' · 任务 ' + (META.counts.task || 0);
    if (META.banner) { $('banner').hidden = false; $('banner').innerHTML = '<b>练习模式</b> · ' + esc(META.banner.zh); }
    $('queueSel').value = S.queue;
    $('kindSeg').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === S.kind)); });
    $('btnEn').setAttribute('aria-pressed', String(S.showEn));
    document.documentElement.classList.toggle('show-en', S.showEn);
  }

  $('queueSel').addEventListener('change', function (e) { S.queue = e.target.value; wr(KEY + ':queue', S.queue); buildRail(); buildPanel(); });
  $('kindSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    S.kind = b.dataset.k; wr(KEY + ':kind', S.kind); paintTop(); buildRail();
    var q = queue(); if (q.length && q.indexOf(cur()) < 0) go(q[0].id); else buildPanel();
  });
  $('btnEn').addEventListener('click', function () { S.showEn = !S.showEn; wr('evibound-review:showEn', S.showEn); paintTop(); });
  $('btnHelp').addEventListener('click', openHelp);
  $('btnGuide').addEventListener('click', function () { openGuide(0); });
  $('btnExport').addEventListener('click', openExport);
  $('btnRail').addEventListener('click', function () { $('rail').classList.toggle('open'); });
  $('rail').addEventListener('click', function (e) { var b = e.target.closest('.row'); if (b) go(b.dataset.id); });
  $('sheet').addEventListener('click', function (e) { var b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
  $('panel').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var it = cur();
    if (b.dataset.q) toggleQ(it, b.dataset.q, b.dataset.v);
    else if (b.dataset.c) setConf(it, b.dataset.c);
    else if (b.dataset.d) decide(it, b.dataset.d);
    else if (b.dataset.t) toggleTag(it, b.dataset.t);
    else if (b.dataset.nav === 'prev') step(-1);
    else if (b.dataset.nav === 'next') step(1);
    else if (b.dataset.nav === 'todo') nextTodo();
  });
  $('panel').addEventListener('input', function (e) { if (e.target.id === 'note') patch(cur(), { comment: e.target.value }, true); });
  $('dock').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'dkPrev') step(-1); else if (b.id === 'dkNext') step(1); else if (b.dataset.d) decide(cur(), b.dataset.d);
  });
  ['helpOv', 'expOv'].forEach(function (id) {
    $(id).addEventListener('click', function (e) {
      if (e.target === $(id) || e.target.closest('[data-close]')) { $(id).hidden = true; return; }
      var s = e.target.closest('[data-save]'), c = e.target.closest('[data-copy]');
      if (s) saveFile(s.dataset.save); else if (c) copyOut(c.dataset.copy);
    });
  });
  document.addEventListener('keydown', function (e) {
    if (!$('guideOv').hidden) {
      if (e.key === 'Escape') { e.preventDefault(); finishGuide(true); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); $('gNext').click(); return; }
      if (e.key === 'ArrowLeft') { e.preventDefault(); guideGo(G.page - 1); return; }
      if (G.page === GUIDE_PAGES.length - 1 && /^[1-9]$/.test(e.key)) {
        var qi = -1;
        for (var i = 0; i < G.quiz.length; i++) { if (G.answers[i] == null) { qi = i; break; } }
        if (qi >= 0 && +e.key <= G.quiz[qi].opts.length) { e.preventDefault(); answerQuiz(qi, +e.key - 1); }
      }
      return;
    }
    var t = e.target, typing = t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.isContentEditable);
    if (e.key === 'Escape') { if (closeOverlays()) { e.preventDefault(); return; } if (typing) { t.blur(); e.preventDefault(); } return; }
    if (typing) { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); t.blur(); nextTodo(); } return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!$('helpOv').hidden || !$('expOv').hidden) return;
    var it = cur(), k = e.key;
    if (k === 'ArrowRight' || k === 'j' || k === 'J') step(1);
    else if (k === 'ArrowLeft' || k === 'k' || k === 'K') step(-1);
    else if (k === 'a' || k === 'A') approve(it);
    else if (k === 'f' || k === 'F') decide(it, 'fix');
    else if (k === 'r' || k === 'R') decide(it, 'reject');
    else if (/^[1-4]$/.test(k)) { var qq = it.questions[+k - 1]; if (!qq) return; toggleQ(it, qq.key); }
    else if (k === 'h' || k === 'H') setConf(it, 'high');
    else if (k === 'm' || k === 'M') setConf(it, 'med');
    else if (k === 'l' || k === 'L') setConf(it, 'low');
    else if (k === 'c' || k === 'C' || k === '/') focusNote();
    else if (k === 'u' || k === 'U') nextTodo();
    else if (k === '?') openHelp();
    else if (k === 'e' || k === 'E') openExport();
    else return;
    e.preventDefault();
  });
  function measureTop() { var h = $('top').getBoundingClientRect().height; if (h) document.documentElement.style.setProperty('--top-h', Math.ceil(h) + 'px'); }
  window.addEventListener('resize', measureTop);

  /* ---------------- start ---------------- */
  var fromHash = (location.hash || '').slice(1);
  var start = ITEMS.filter(function (it) { return it.id.replace(/_/g, '-') === fromHash; })[0];
  var saved = BY_ID[rd(KEY + ':pos', '')];
  S.current = (start || saved || queue()[0] || ITEMS[0]).id;
  paintTop(); buildRail(); paintSheet(); buildPanel(); paintProgress(); paintDock(); measureTop();
  openGuide(0);
  window.addEventListener('hashchange', function () {
    var id = (location.hash || '').slice(1), it = ITEMS.filter(function (x) { return x.id.replace(/_/g, '-') === id; })[0];
    if (it && it.id !== S.current) go(it.id);
  });
  connect();
})();
</script>
